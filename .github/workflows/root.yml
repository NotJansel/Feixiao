name: Build & Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: https://github.com/actions/checkout@v7

      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v4

      - name: Set up Java
        uses: https://github.com/actions/setup-java@v6

        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"

      - name: Gradle (Build)
        run: "./gradlew build"

      - name: Login to Registry
        uses: https://github.com/docker/login-action@v4

        with:
          registry: git.jansel.dev
          username: ${{ secrets.MAIL }}
          password: ${{ secrets.KEY }}

      - name: Build and push
        uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: git.jansel.dev/jansel/feixiao:latest,git.jansel.dev/jansel/feixiao:${{ steps.date.outputs.date }}
